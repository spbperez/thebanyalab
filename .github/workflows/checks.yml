name: checks
on:
  push: { branches: [main] }
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Собрать сайт из client.json
        run: npm run build
      - name: Проверки перед выкаткой
        run: npm run check
