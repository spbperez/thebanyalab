{{> _head}}
<section class="page-head">
  <span class="lab">The library</span>
  <h1>What people ask before their first banya.</h1>
  <p class="body">One question, one page, one direct answer. Nothing here is written to fill a schedule.</p>
</section>
<section class="band-plain">
  <ul class="answers-list">
  {{#each answers}}
    <li>
      <h2><a href="/answers/{{slug}}/">{{question}}</a></h2>
      <p>{{short}}</p>
    </li>
  {{/each}}
  </ul>
</section>
{{> _footer}}
